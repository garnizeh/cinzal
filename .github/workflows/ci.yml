name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run (an older commit on the same PR, or the same branch)
# never needs to finish once a newer one has started — cancelling it frees
# the runner for the run that actually matters instead of queuing behind
# stale work. head_ref is set for pull_request events (the PR's own branch);
# it is empty for push, where ref (refs/heads/main) is what's stable instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # GOTOOLCHAIN=local means "use the toolchain that is installed, never switch
  # to another one". Paired with go-version-file below, that is what turns
  # go.mod's floor into an actual pin, without repeating the version anywhere.
  #
  # RFC-001 §4 names the version and §6.3 explains why the project cares: the
  # design is staked on `seed + order log` reproducing a match exactly, and
  # "which Go built it" should never be a candidate explanation for a
  # determinism mismatch. go.mod cannot express a pin on its own — its `go`
  # directive is a floor a newer toolchain satisfies, and a `toolchain`
  # directive equal to it is rejected as redundant.
  GOTOOLCHAIN: local

  # Pinned so a tool release cannot change what CI asserts without a reviewed
  # commit. These are build tools and stay out of go.mod deliberately — a tool
  # directive drags its own dependency graph into the module, and RFC-001 §4
  # keeps the runtime footprint deliberately small.
  GOLANGCI_LINT_VERSION: v2.13.1
  TEMPL_VERSION: v0.3.1020
  # generate-check (issue #316) regenerates internal/store's committed sqlc
  # output at exactly this version and diffs the result — a different sqlc
  # release can format identically-configured output differently, so this
  # pin is no longer just "which sqlc installs," it is part of what
  # generate-check asserts. Bumping it and NOT regenerating
  # (`make generate`, commit the result) in the same pull request fails the
  # gate on formatting drift instead of on any real change.
  SQLC_VERSION: v1.31.1
  GITLEAKS_VERSION: 8.30.1
  # Pinning the version pins WHICH release, not WHAT is in it. Published by
  # upstream in gitleaks_8.30.1_checksums.txt; verified before extraction,
  # because the archive is unpacked into a directory on PATH and then run in a
  # job that can read the repository.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # golang.org/x/perf, benchstat's module, ships no tagged releases — only
  # pseudo-versions — so the pin is a commit, not a semver tag like the
  # others above. Same reasoning as those: a tool release (here, a commit)
  # should not change what CI does without a reviewed change to this file.
  BENCHSTAT_VERSION: v0.0.0-20260825160852-19be9d8e6c70
  # Both Go-installable, so no binary-archive/checksum dance like gitleaks
  # needs above — `go install` itself resolves and verifies the module
  # through the checksum database. Same reasoning as every other pin here: a
  # tool release should not change what CI does without a reviewed commit to
  # this file. See #373 and the `vuln` job/Makefile target.
  GOVULNCHECK_VERSION: v1.7.0
  OSV_SCANNER_VERSION: v2.5.1

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The path-gate step below diffs against the base commit, which a
          # shallow (default) checkout does not contain. Full history is more
          # than that step needs, but it is what the rest of this repo's gates
          # already fetch (see `secrets` and `bench-compare`'s own checkouts),
          # and a second depth convention here would be one more thing to keep
          # consistent for no real saving.
          fetch-depth: 0
          # The steps below run repository-controlled code - Makefile targets,
          # module downloads, three third-party tools. Without this, checkout
          # leaves the job token in .git/config where any of them can read it.
          persist-credentials: false

      # Issue #336: nothing past this point can affect anything but Go source,
      # its build tooling, and the gates that inspect them, so a PR that
      # touches none of that (docs, GDD/RFC prose, decision records) skips the
      # whole toolchain install and `make check` run rather than paying full
      # wall-clock time for a diff that could not possibly trip a Go-side
      # gate. `secrets` is deliberately NOT this job's problem to skip — it
      # scans docs too, and runs unconditionally in its own job below.
      #
      # Fails OPEN, not closed: see changed-paths/action.yml's own header.
      # This workflow file and this action are both in the path list because
      # a change to either must be able to exercise itself (#125) — a gate
      # that cannot trigger its own test is the failure mode #125 shipped.
      - name: Determine whether this change can affect check
        id: changed
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            internal
            cmd
            scripts
            go.mod
            go.sum
            Makefile
            .golangci.yml
            .github/workflows/ci.yml
            .github/actions/changed-paths/action.yml

      # go.mod is the single source of the version. Repeating it here would be
      # one more thing to keep in sync, and the copy that drifted would be the
      # one CI trusted.
      - uses: actions/setup-go@v7
        if: steps.changed.outputs.touched == 'true'
        with:
          go-version-file: go.mod
          check-latest: false

      # The pin is worthless if it silently fails to apply, and a runner
      # resolving a different version would look identical to success.
      - name: Assert the pinned Go version is the one in use
        if: steps.changed.outputs.touched == 'true'
        run: |
          set -euo pipefail
          expected="go$(awk '/^go /{print $2; exit}' go.mod)"
          actual="$(go env GOVERSION)"
          if [ -z "${expected#go}" ]; then
            echo "::error::could not read the go directive from go.mod"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::Go version pin did not apply: expected $expected, got $actual"
            exit 1
          fi
          echo "Go $actual, pinned by go.mod and GOTOOLCHAIN=$GOTOOLCHAIN"

      # gitleaks is deliberately absent from this list: the secret scan moved
      # to its own always-runs job (issue #336) and no longer shares this
      # job's toolchain install.
      - name: Install pinned tools
        if: steps.changed.outputs.touched == 'true'
        run: |
          set -euo pipefail
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          go install "github.com/a-h/templ/cmd/templ@${TEMPL_VERSION}"
          go install "github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}"
          go install "golang.org/x/perf/cmd/benchstat@${BENCHSTAT_VERSION}"

      # One definition, two callers: the Makefile is the definition and this
      # workflow is a caller, so `make check` reproduces a CI failure locally.
      # Each gate in #9-#12 appends itself to the `check` target rather than to
      # this file.
      # -k keeps going after a failing target instead of stopping at the first.
      # A contributor should see every failing gate in one run rather than
      # fixing one, pushing, and discovering the next. The job still fails.
      #
      # Locally `make check` stops at the first failure, which is what you want
      # while iterating; this is the one place the two differ, and deliberately.
      #
      # generate-check joined check-nosecrets's own target line in issue
      # #316, once GENERATED held sqlc's real output (issue #315) to compare
      # against — see the Makefile's own comment above check-nosecrets for
      # the full reasoning, including why templ's still-empty half of
      # GENERATED does not make this VACUOUS again. Nothing here needs to
      # change to pick it up: this step already runs whatever
      # check-nosecrets names.
      #
      # check-nosecrets, not check: `secrets` runs in its own job below and
      # must not run twice. `make check` (the full list, secrets included)
      # stays the thing a contributor runs locally — see the Makefile's own
      # comment on the split.
      - name: make check-nosecrets
        if: steps.changed.outputs.touched == 'true'
        run: make -k check-nosecrets

  # Issue #336: split out of `check` so the secret scan is never subject to
  # that job's path gate. `make check`'s own comment on the split explains
  # why `secrets` cannot just be exempted from the gate as a step inside
  # `check` instead — there is no per-target step boundary in `make -k check`
  # to hang a selective `if:` on, only "the whole invocation". A DOCS-ONLY PR
  # IS EXACTLY THE CASE THIS GATE EXISTS FOR: a token pasted into a decision
  # record or a roadmap entry is a leak whether or not the same PR happens to
  # touch Go source, so this job carries no `if:` and no path check — it
  # always runs, on every pull_request and every push to main.
  #
  # No Go toolchain here at all — check-secrets.sh only needs `git` (already
  # on every runner) and the `gitleaks` binary. Splitting this out of `check`
  # means it no longer pays for setup-go and the four `go install`s as a side
  # effect of sharing a job with them, and it now runs in parallel with
  # `check`'s Go work rather than sequentially inside it.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The secret scan reads history, not just the working tree: a
          # credential committed and later removed is still leaked. The
          # default shallow clone would hide exactly those commits, and the
          # base of the range computed below would not resolve.
          #
          # This fetches every branch, which is why the history scan is
          # scoped to a commit range rather than left to scan every ref it
          # can see (#37). The depth stays; the scope is what was wrong.
          fetch-depth: 0
          # gitleaks itself, and check-secrets.sh, run against this checkout.
          # Without this, checkout leaves the job token in .git/config where
          # either could read it.
          persist-credentials: false

      # gitleaks ships binaries rather than a go-installable command, so it is
      # downloaded — and verified before anything is extracted from it. No Go
      # toolchain in this job to give it a GOPATH/bin already on PATH, so the
      # archive is extracted to RUNNER_TEMP instead and that directory is
      # added to PATH for the remaining steps.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xz -C "$RUNNER_TEMP/gitleaks-bin" -f "$archive" gitleaks
          rm -f "$archive"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Assert gitleaks is on PATH
        run: gitleaks version

      # The secret scan asks whether THE CHANGE adds a credential, not whether
      # the repository contains one anywhere (#37). Only this workflow knows
      # what "the change" is, so it computes the range and the gate consumes
      # it; the gate itself decides what to do with one that does not
      # resolve. Self-contained bash with no dependency on anything else this
      # job does — lifted from `check` unchanged (#336).
      #
      # The shas arrive as environment variables rather than inline ${{ }}
      # expansions: an expansion is pasted into the script before bash sees
      # it, so a value containing shell syntax would be executed rather than
      # read.
      - name: Determine the commits this change adds
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          resolves() { git rev-parse --verify --quiet "$1^{commit}" >/dev/null 2>&1; }

          case "$EVENT_NAME" in
            pull_request)
              for sha in "$PR_BASE_SHA" "$PR_HEAD_SHA"; do
                resolves "$sha" || {
                  echo "::error::$sha is not in this clone — checkout must fetch"
                  echo "::error::enough history for the base..head range to resolve."
                  exit 1
                }
              done
              range="$PR_BASE_SHA..$PR_HEAD_SHA"
              ;;
            push)
              resolves "$PUSH_AFTER" || {
                echo "::error::the pushed commit $PUSH_AFTER is not in this clone"
                exit 1
              }
              if resolves "$PUSH_BEFORE"; then
                range="$PUSH_BEFORE..$PUSH_AFTER"
              else
                # A branch that did not exist before, or one that was force-
                # pushed: "before" is either all zeros or a commit no longer
                # reachable. There is no honest range, so the whole history of
                # the pushed commit is scanned. Over-scanning, never under.
                echo "::notice::$PUSH_BEFORE does not resolve — scanning the full history of $PUSH_AFTER"
                range="$PUSH_AFTER"
              fi
              ;;
            *)
              # Deliberately not a fallback. A new trigger added to this
              # workflow must decide what "the change" means for it, rather
              # than inheriting a guess from here.
              echo "::error::no commit range defined for the $EVENT_NAME event"
              exit 1
              ;;
          esac

          echo "CINZAL_SECRETS_RANGE=$range" >> "$GITHUB_ENV"
          echo "secret scan scoped to $range"

      - name: make secrets
        run: make secrets

  # Issue #373: a newly-disclosed CVE against an already-vendored dependency
  # is a fact about time, not about this diff — the vulnerable version can
  # already be sitting in go.sum from a PR merged months ago. Path-gating
  # this the way `check` gates on internal/cmd/go.mod/go.sum would let a PR
  # that happens not to touch those paths merge past a freshly-disclosed CVE
  # in an unrelated dependency. Same reasoning `secrets` (above) already
  # uses for staying unconditional, aimed at a different bot: no `if:`, no
  # path check, always runs, on every pull_request and every push to main.
  #
  # Two tools, not one: govulncheck's call-graph reachability analysis only
  # fires against OSV entries carrying symbol-level data, and GO-2026-6253
  # (the CVE that motivated this job — github.com/moby/go-archive v0.2.0,
  # caught by CodeRabbit's SAST step on #372/#311's PR, missed by every gate
  # `make check` already ran) has none — its OSV entry is
  # "review_status":"UNREVIEWED" with an empty ecosystem_specific block.
  # osv-scanner's plain version-range match against go.mod/go.sum catches it
  # regardless. govulncheck stays as defense-in-depth for vulnerabilities
  # that do carry symbol data — this CVE's gap is specific to it, not a
  # general reason to drop the tool.
  vuln:
    name: vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # No history scan here, unlike secrets — both tools only need the
          # working tree's go.mod/go.sum and the current source, so the
          # default shallow clone is enough.
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Install pinned tools
        run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go install "github.com/google/osv-scanner/v2/cmd/osv-scanner@${OSV_SCANNER_VERSION}"

      - name: make vuln
        run: make vuln

  # Issue #80's exit demonstration: "resolve(s, o) == resolve(s, o)
  # byte-identical, and a golden 15-round replay reproduces on a second
  # machine and a second OS." `check` above only ever runs on ubuntu-latest,
  # so it can prove the determinism suite (internal/rules/determinism_test.go,
  # issue #77) is deterministic across repeated runs in one process — never
  # across OS or architecture. macos-latest runners are arm64, so this one
  # matrix covers both axes RFC §6.3 names as hazards: a stray `for k := range
  # m` and a float64 intermediate.
  #
  # Runs the whole internal/rules package rather than a curated -run subset:
  # a renamed test can silently fall out of a name-based filter, which is
  # exactly the "gate that passes when it can't run" failure this repo's own
  # gates are held to (see this file's own header comment on that standard).
  replay:
    name: replay (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The path-gate step below diffs against the base commit, which a
          # shallow (default) checkout does not contain. Same reasoning as
          # `check`'s own checkout, above.
          fetch-depth: 0
          persist-credentials: false

      # Issue #336: this matrix pays for two runners' worth of Go toolchain
      # setup and a full `internal/rules` test run — money not worth spending
      # on a diff that could not touch Go source. Same path list and fail-
      # open posture as `check`'s own gate; see changed-paths/action.yml.
      - name: Determine whether this change can affect replay
        id: changed
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            internal
            cmd
            scripts
            go.mod
            go.sum
            Makefile
            .golangci.yml
            .github/workflows/ci.yml
            .github/actions/changed-paths/action.yml

      - uses: actions/setup-go@v7
        if: steps.changed.outputs.touched == 'true'
        with:
          go-version-file: go.mod
          check-latest: false

      # Same reasoning as `check`'s own version-pin assertion above: "which
      # Go built it" must never be a candidate explanation for a divergence
      # this job exists specifically to catch across machines.
      - name: Assert the pinned Go version is the one in use
        if: steps.changed.outputs.touched == 'true'
        run: |
          set -euo pipefail
          expected="go$(awk '/^go /{print $2; exit}' go.mod)"
          actual="$(go env GOVERSION)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Go version pin did not apply: expected $expected, got $actual"
            exit 1
          fi

      - name: make replay
        if: steps.changed.outputs.touched == 'true'
        run: make replay

  bench:
    name: bench
    runs-on: ubuntu-latest
    # Records real history from real CI runners on every push to main —
    # issue #112. Restricted to pushes (this workflow's push trigger only
    # ever fires for main) rather than every pull request, both because a
    # baseline only means something taken from the same branch every time,
    # and because internal/rules/gen's own performance cliff (up to ~80 full
    # graph regenerations per seed at players=5) already makes this job slow
    # enough without multiplying it across every open PR.
    #
    # bench-baseline (not bench) since #113: BENCH_COUNT=10 repeated samples
    # here are what let the bench-compare job below (pull_request only) run
    # a real benchstat comparison against this artifact rather than a bare
    # percentage diff against one prior number — see
    # scripts/check-bench-regression.sh's own header for why that matters on
    # a shared runner.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false

      - name: make bench-baseline
        run: make bench-baseline

      - name: Upload benchmark baseline
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ github.sha }}
          path: baseline.bench
          retention-days: 90

  bench-compare:
    name: bench-compare
    runs-on: ubuntu-latest
    # Issue #113: catches a regression before merge by benchmarking the pull
    # request's base commit and its own head, back to back, and comparing
    # the two.
    #
    # BOTH SIDES ARE MEASURED HERE, ON ONE RUNNER — issue #125. This job
    # used to download the bench job's most recent push-to-main artifact and
    # compare against that, and it could never work: benchstat treats the
    # `cpu:` line as part of a benchmark's configuration, and GitHub's hosted
    # runners do not guarantee a CPU model, so the two files routinely shared
    # no comparable row and check-bench-regression.sh reported "inconclusive,
    # not clean" — correctly, but on every PR. The first pull request where
    # this job ever ran a real comparison (#124) was also the first where it
    # failed for that reason; every earlier one took the "no baseline yet"
    # early exit and went green in seconds without comparing anything.
    #
    # Stripping the `cpu:` line was the cheaper fix and the wrong one. On
    # #124 the cross-runner numbers moved BenchmarkAssignNodeTypes by +8.6%,
    # a benchmark that pull request does not touch — against a 20% threshold.
    # A comparison whose noise floor is half its threshold is exactly the
    # "red check might be nothing" failure the paragraph below exists to
    # prevent, so the fix has to make the two samples come from comparable
    # hardware rather than merely make benchstat willing to print a delta.
    #
    # The cost is one extra benchmark run per pull request that touches the
    # measured code. The bench job above still records main's history as an
    # artifact (#112) — that is its own purpose, and nothing here reads it.
    #
    # A REQUIRED STATUS CHECK — issue #127. This job ran advisory for a
    # while: allowed to fail for real (no `continue-on-error`), but not in
    # branch protection's required contexts, because two data points
    # (before/after #61) could not characterise real CI-runner noise against
    # THRESHOLD/GEOMEAN_THRESHOLD. #124's own +6.27% same-runner drift on an
    # untouched benchmark was the first real measurement and, on its own,
    # was reason for caution rather than confidence. Six more real
    # comparisons landed since (PRs #149, #151, #179) with zero false
    # positives — worst single-case drift +6.27%, worst geomean 0.93%,
    # both comfortably inside the 20%/10% thresholds — and #127 promoted it
    # on that evidence. See scripts/check-bench-regression.sh's own header
    # for the threshold reasoning and CONTRIBUTING.md's gate table for where
    # this is now recorded.
    #
    # The steps below are gated on the first one having found a reason to run
    # at all (the measured code, or this gate itself, actually changed) — a
    # skip there is a legitimate outcome, not a defect. Nothing else in this
    # job can skip: once it decides to measure, it either produces a
    # comparison or fails.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed twice over: to diff base...head below, and to check the
          # base commit out and benchmark it. The default shallow clone
          # contains neither.
          fetch-depth: 0
          persist-credentials: false

      # This gate's own definition is in the path list on purpose: a change to
      # the workflow job, this composite action, or the comparison script
      # must exercise the thing it changes. Without it, the only way to test
      # an edit to this job is a pull request that happens to also touch
      # internal/rules/gen — which is how #125's defect reached main green in
      # the first place.
      #
      # Issue #336 lifted this from a bespoke step into the same composite
      # action `check` and `replay` use, so the "diff against a path list,
      # fail open" mechanism has one definition instead of three. The path
      # list stays this job's own and deliberately narrower than
      # `check`/`replay`'s — internal/rules/gen specifically, not all Go
      # source — because what this job measures is that package's
      # performance, not its correctness.
      - name: Check whether this PR touches the benchmarked code or this gate
        id: changed
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            internal/rules/gen
            .github/workflows/ci.yml
            .github/actions/changed-paths/action.yml
            scripts/check-bench-regression.sh
            Makefile

      # What actions/checkout left us on: the synthetic merge commit
      # (refs/pull/N/merge), NOT the pull request's head commit. That is the
      # side this job wants to measure, and deliberately so — see the
      # "Benchmark this pull request" step below. Captured in its own step,
      # unconditionally, because the steps in between check other commits out
      # and this one is cheap enough not to need the same path gate as the
      # benchmark runs themselves.
      - name: Capture the commit to benchmark
        id: head
        run: echo "head_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        if: steps.changed.outputs.touched == 'true'
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Install benchstat
        if: steps.changed.outputs.touched == 'true'
        run: go install "golang.org/x/perf/cmd/benchstat@${BENCHSTAT_VERSION}"

      # The base commit is benchmarked first and the head second, always in
      # that order. Whichever runs second inherits any drift the runner
      # accumulated (thermal, a noisy neighbour ramping up), so the order is
      # fixed rather than left to chance: a consistent bias is something a
      # reader can reason about, an inconsistent one is not. `*.bench` is
      # gitignored, so base.bench survives the checkout back to the head.
      #
      # git checkout, not a second actions/checkout: the same clone keeps the
      # module cache warm and makes the two runs differ in nothing but the
      # tree under test.
      - name: Benchmark the base commit
        if: steps.changed.outputs.touched == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git checkout --detach --quiet "$BASE_SHA"
          make bench-baseline BASELINE=base.bench

      # BASELINE is the file the step above just produced. This target
      # benchmarks the current tree and runs check-bench-regression.sh
      # against it — everything after the checkout is one make invocation, so
      # a flagged regression reproduces locally with the same command.
      #
      # HEAD_REF is the merge commit, not github.event.pull_request.head.sha,
      # and the pair (base.sha, merge commit) is the point. The merge commit
      # is base.sha plus this pull request's changes and nothing else, so the
      # difference between the two sides is exactly what merging would do to
      # main — which is the question a pre-merge benchmark comparison asks.
      # Benchmarking head.sha instead would break that whenever the branch is
      # behind: head.sha does not contain the commits main gained since the
      # branch point, while base.sha does, so every one of those unrelated
      # commits would be measured backwards and charged to this pull request.
      - name: Benchmark this pull request and compare
        if: steps.changed.outputs.touched == 'true'
        env:
          HEAD_REF: ${{ steps.head.outputs.head_ref }}
        run: |
          set -euo pipefail
          git checkout --detach --quiet "$HEAD_REF"
          make bench-compare BASELINE=base.bench
