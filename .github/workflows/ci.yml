name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run (an older commit on the same PR, or the same branch)
# never needs to finish once a newer one has started — cancelling it frees
# the runner for the run that actually matters instead of queuing behind
# stale work. head_ref is set for pull_request events (the PR's own branch);
# it is empty for push, where ref (refs/heads/main) is what's stable instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # GOTOOLCHAIN=local means "use the toolchain that is installed, never switch
  # to another one". Paired with go-version-file below, that is what turns
  # go.mod's floor into an actual pin, without repeating the version anywhere.
  #
  # RFC-001 §4 names the version and §6.3 explains why the project cares: the
  # design is staked on `seed + order log` reproducing a match exactly, and
  # "which Go built it" should never be a candidate explanation for a
  # determinism mismatch. go.mod cannot express a pin on its own — its `go`
  # directive is a floor a newer toolchain satisfies, and a `toolchain`
  # directive equal to it is rejected as redundant.
  GOTOOLCHAIN: local

  # Pinned so a tool release cannot change what CI asserts without a reviewed
  # commit. These are build tools and stay out of go.mod deliberately — a tool
  # directive drags its own dependency graph into the module, and RFC-001 §4
  # keeps the runtime footprint deliberately small.
  GOLANGCI_LINT_VERSION: v2.11.4
  TEMPL_VERSION: v0.3.1001
  SQLC_VERSION: v1.28.0
  GITLEAKS_VERSION: 8.30.1
  # Pinning the version pins WHICH release, not WHAT is in it. Published by
  # upstream in gitleaks_8.30.1_checksums.txt; verified before extraction,
  # because the archive is unpacked into a directory on PATH and then run in a
  # job that can read the repository.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The secret scan reads history, not just the working tree: a
          # credential committed and later removed is still leaked. The default
          # shallow clone would hide exactly those commits, and the base of the
          # range computed below would not resolve.
          #
          # This fetches every branch, which is why the history scan is scoped
          # to a commit range rather than left to scan every ref it can see
          # (#37). The depth stays; the scope is what was wrong.
          fetch-depth: 0
          # The steps below run repository-controlled code - Makefile targets,
          # module downloads, three third-party tools. Without this, checkout
          # leaves the job token in .git/config where any of them can read it.
          persist-credentials: false

      # go.mod is the single source of the version. Repeating it here would be
      # one more thing to keep in sync, and the copy that drifted would be the
      # one CI trusted.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false

      # The pin is worthless if it silently fails to apply, and a runner
      # resolving a different version would look identical to success.
      - name: Assert the pinned Go version is the one in use
        run: |
          set -euo pipefail
          expected="go$(awk '/^go /{print $2; exit}' go.mod)"
          actual="$(go env GOVERSION)"
          if [ -z "${expected#go}" ]; then
            echo "::error::could not read the go directive from go.mod"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::Go version pin did not apply: expected $expected, got $actual"
            exit 1
          fi
          echo "Go $actual, pinned by go.mod and GOTOOLCHAIN=$GOTOOLCHAIN"

      - name: Install pinned tools
        run: |
          set -euo pipefail
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          go install "github.com/a-h/templ/cmd/templ@${TEMPL_VERSION}"
          go install "github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}"

          # gitleaks ships binaries rather than a go-installable command, so it
          # is downloaded - and verified before anything is extracted from it.
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xz -C "$(go env GOPATH)/bin" -f "$archive" gitleaks
          rm -f "$archive"
          gitleaks version

      # The secret scan asks whether THE CHANGE adds a credential, not whether
      # the repository contains one anywhere (#37). Only this workflow knows
      # what "the change" is, so it computes the range and the gate consumes it;
      # the gate itself decides what to do with one that does not resolve.
      #
      # The shas arrive as environment variables rather than inline ${{ }}
      # expansions: an expansion is pasted into the script before bash sees it,
      # so a value containing shell syntax would be executed rather than read.
      - name: Determine the commits this change adds
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          resolves() { git rev-parse --verify --quiet "$1^{commit}" >/dev/null 2>&1; }

          case "$EVENT_NAME" in
            pull_request)
              for sha in "$PR_BASE_SHA" "$PR_HEAD_SHA"; do
                resolves "$sha" || {
                  echo "::error::$sha is not in this clone — checkout must fetch"
                  echo "::error::enough history for the base..head range to resolve."
                  exit 1
                }
              done
              range="$PR_BASE_SHA..$PR_HEAD_SHA"
              ;;
            push)
              resolves "$PUSH_AFTER" || {
                echo "::error::the pushed commit $PUSH_AFTER is not in this clone"
                exit 1
              }
              if resolves "$PUSH_BEFORE"; then
                range="$PUSH_BEFORE..$PUSH_AFTER"
              else
                # A branch that did not exist before, or one that was force-
                # pushed: "before" is either all zeros or a commit no longer
                # reachable. There is no honest range, so the whole history of
                # the pushed commit is scanned. Over-scanning, never under.
                echo "::notice::$PUSH_BEFORE does not resolve — scanning the full history of $PUSH_AFTER"
                range="$PUSH_AFTER"
              fi
              ;;
            *)
              # Deliberately not a fallback. A new trigger added to this
              # workflow must decide what "the change" means for it, rather
              # than inheriting a guess from here.
              echo "::error::no commit range defined for the $EVENT_NAME event"
              exit 1
              ;;
          esac

          echo "CINZAL_SECRETS_RANGE=$range" >> "$GITHUB_ENV"
          echo "secret scan scoped to $range"

      # One definition, two callers: the Makefile is the definition and this
      # workflow is a caller, so `make check` reproduces a CI failure locally.
      # Each gate in #9-#12 appends itself to the `check` target rather than to
      # this file.
      # -k keeps going after a failing target instead of stopping at the first.
      # A contributor should see every failing gate in one run rather than
      # fixing one, pushing, and discovering the next. The job still fails.
      #
      # Locally `make check` stops at the first failure, which is what you want
      # while iterating; this is the one place the two differ, and deliberately.
      #
      # generate-check is NOT a prerequisite of check: GENERATED is empty
      # until M3/M5 declare real generated paths, and a gate that can only
      # report VACUOUS stays out of the aggregate rather than passing by not
      # running (see the Makefile's own comment on `check`). It rejoins once
      # there is something for it to actually compare.
      - name: make check
        run: make -k check

  bench:
    name: bench
    runs-on: ubuntu-latest
    # Issue #112 is deliberately Phase 1 only: record real history from real
    # CI runners, nothing more. No comparison, no threshold, and nothing here
    # can block a merge (see the Makefile's own `bench` target comment and
    # CONTRIBUTING.md "What is deliberately not a gate") — #113 is where that
    # decision gets made, once there is more than one data point to reason
    # about. Restricted to pushes to main (this workflow's push trigger only
    # ever fires for main) rather than every pull request, both because a
    # baseline only means something taken from the same branch every time,
    # and because internal/rules/gen's own performance cliff (up to ~80 full
    # graph regenerations per seed at players=5) already makes this job slow
    # enough without multiplying it across every open PR.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false

      # shell: bash is explicit, not decorative — GitHub Actions only
      # guarantees `-o pipefail` on this step when the shell is named this
      # way (actions/runner-images#4459); the implicit unspecified default
      # is documented to behave the same but does not reliably in practice.
      # Without pipefail, `make bench | tee` would report success off tee's
      # own exit code even when make bench fails, exactly the "green when it
      # shouldn't be" failure CONTRIBUTING.md's gates spend real effort
      # avoiding.
      - name: make bench
        shell: bash
        run: make bench | tee bench-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ github.sha }}
          path: bench-results.txt
          retention-days: 90
