# CodeRabbit repository configuration.
#
# reviews.path_filters exists here because CodeRabbit blocks certain paths
# by default (a built-in list, not a per-repo dashboard setting — an empty
# path_filters here does NOT lift it, confirmed on PR #109 after #108's
# first attempt at this fix left the block in place). One of those defaults
# matches "gen" directories, which silently excluded internal/rules/gen —
# hand-written code, not generated, and the entire subject of PR #107 — from
# every CodeRabbit pass on that PR. The pre-merge "Linked Issues" check
# eventually surfaced it directly: "Core generator files are excluded by
# the !**/gen/** filter, so the implementation of issue #59 constraints
# cannot be verified."
#
# Per CodeRabbit's own explanation (github.com/garnizeh/cinzal/pull/109):
# "You can override this behavior by explicitly including those paths in
# the path filters" — an inclusion entry (no leading !) removes the
# matching default-block pattern instead of adding a new exclusion. Hence
# the entry below, naming the exact path rather than reopening every
# default-blocked pattern repo-wide.
#
# No generated code exists yet in this repo (see CLAUDE.md: generate-check
# is VACUOUS until M3/M5). When sqlc/templ output lands, exclude its actual
# generated paths by name (e.g. !internal/store/sqlc/**, !**/*_templ.go) —
# that's a normal exclusion (leading !) on a path CodeRabbit doesn't already
# block by default, unrelated to the override below.
reviews:
  path_filters:
    - internal/rules/gen/**
